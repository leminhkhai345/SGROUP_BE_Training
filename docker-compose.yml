services:
  postgres:
    image: postgres:16-alpine
    container_name: basic_be_db
    restart: always
    environment:
      POSTGRES_DB: basic_be_training
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed-rbac.sql:/docker-entrypoint-initdb.d/02-seed-rbac.sql:ro
      - ./database/migrations/001_submission_version.sql:/docker-entrypoint-initdb.d/03-migration.sql:ro

volumes:
  postgres_data:

